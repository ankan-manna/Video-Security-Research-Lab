name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      # apps/inspector drives a real browser via Playwright.
      - run: npx playwright install --with-deps chromium
      - run: npm run build --workspaces --if-present
      - run: npm test
